<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>The Media Center — Panoply</title><style>:root{color-scheme:light;--bg:#ffffff;--ink:#1b2635;--sub:#617084;--line:#dfe5ec;--gold:#8b6334}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{border-bottom:1px solid var(--line);background:#f6f8fa}header .inner,main,footer{max-width:1020px;margin:auto;padding:24px 22px}small{color:var(--gold);letter-spacing:.2em;font-size:11px;font-weight:700}h1{font:normal clamp(34px,6vw,50px) Georgia,serif;margin:5px 0}header p{color:var(--sub);margin:0}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 14px}.tabs{display:flex;gap:6px}button,input,select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:9px 12px;background:#fff;color:var(--ink)}button{cursor:pointer}button[aria-pressed=true]{background:#244d7b;color:#fff;font-weight:700}input{flex:1;min-width:160px}select{min-width:115px}.count{color:var(--sub);font-size:12px}h2{font:normal 26px Georgia,serif;margin:28px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--line)}article{display:flex;gap:16px;padding:19px 0;border-bottom:1px solid var(--line);align-items:center}.poster{overflow:hidden;position:relative;flex:0 0 106px;width:106px;height:155px;background:#e9edf2;border:1px solid #d9e0e8;border-radius:3px;display:grid;place-items:center;text-align:center;color:#7b8898;font:12px Georgia,serif;padding:7px}.poster img{width:100%;height:100%;object-fit:cover;display:block}.info{min-width:0;flex:1}.title{font-size:19px;font-weight:700}.rank{color:var(--gold);font-size:13px;margin-right:8px}.year,.format{color:var(--sub);font-size:12px;font-weight:400;margin-left:7px}.note{font-size:12px;color:var(--sub);margin:6px 0}.lookup{color:var(--gold);font-size:12px;text-decoration:none}.lookup:hover{text-decoration:underline}footer{border-top:1px solid var(--line);font-size:12px;color:var(--sub)}@media(max-width:550px){.tools .tabs{width:100%}.tabs button{flex:1}.poster{width:86px;flex-basis:86px;height:126px}article{gap:12px}.title{font-size:18px}}</style></head><body><header><div class="inner"><small>THE PANOPLY</small><h1>The Media Center</h1><p>Movies, television &amp; what to watch next.</p></div></header><main><div class="tools"><div class="tabs"><button id="main" aria-pressed="true">Main Watchlist</button><button id="candidates" aria-pressed="false">Candidates</button></div><input id="search" type="search" placeholder="Search titles…" aria-label="Search titles"><select id="format" aria-label="Filter by format"><option value="All">All formats</option><option value="Movie">Movies</option><option value="TV">Television</option></select></div><div class="count" id="count"></div><section id="results" aria-live="polite"></section></main><footer>Public watchlists only. Private records remain in Google Drive. Poster artwork is added automatically when a verified source is available. Ratings and streaming information are not yet verified.</footer><script>
let lists={main:[],candidates:[]};const posterCache=new Map();async function findPoster(x){if(x.poster)return x.poster;return null}async function loadPoster(x,container){const url=await findPoster(x);if(!container.isConnected)return;if(!url){container.textContent=x.title;return}const img=document.createElement('img');img.src=url;img.alt=x.title+' poster';img.loading='lazy';img.onerror=()=>{container.textContent=x.title};container.replaceChildren(img)}async function loadCatalog(){try{const response=await fetch('./catalog.json',{cache:'no-cache'});if(!response.ok)throw Error('Catalog unavailable');const data=await response.json();for(const key of ['main','candidates'])lists[key]=(data.lists[key]||[]).map((x,i)=>({...x,id:i+1}));render()}catch(e){document.getElementById('results').textContent='Unable to load the watchlist. Please refresh.'}}let active='main';const get=id=>document.getElementById(id);function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}function render(){get('main').setAttribute('aria-pressed',active==='main');get('candidates').setAttribute('aria-pressed',active==='candidates');const q=get('search').value.toLowerCase().trim(),f=get('format').value,all=lists[active],shown=all.filter(x=>x.title.toLowerCase().includes(q)&&(f==='All'||x.type===f));get('count').textContent=shown.length+' of '+all.length+' titles';const root=get('results');root.replaceChildren();if(!shown.length){root.append(node('p','','No matching titles.'));return}for(const group of [...new Set(shown.map(x=>x.group))]){root.append(node('h2','',group));for(const x of shown.filter(x=>x.group===group)){const a=node('article'),poster=node('div','poster',''),info=node('div','info'),heading=node('div','title'),rank=node('span','rank','#'+x.id),title=node('span','',x.title),year=node('span','year','('+x.year+')'),format=node('span','format',x.type),note=node('p','note','Ratings and availability not yet verified'),link=node('a','lookup','Wikipedia ↗');link.href='https://en.wikipedia.org/wiki/Special:Search?search='+encodeURIComponent(x.title+' '+x.year);link.target='_blank';link.rel='noopener noreferrer';heading.append(rank,title,year);info.append(heading,format,note,link);a.append(poster,info);root.append(a);loadPoster(x,poster)}}}get('main').onclick=()=>{active='main';render()};get('candidates').onclick=()=>{active='candidates';render()};get('search').oninput=render;get('format').onchange=render;loadCatalog();</script></body></html>
