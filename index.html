  transition:background-color .15s,color .15s,border-color .15s;
}
.header-controls .tabs button:hover{background:#f2f5f7;border-color:#b8c8d4}
.header-controls .tabs button[aria-pressed=true]{
  background:#243f59;
  border-color:#243f59;
  color:#fff;
  box-shadow:inset 0 -2px 0 #b69a62;
  font-weight:700;
}
.header-controls .search-control{margin-left:auto;flex:0 0 auto}
.header-controls .search-control.open{flex:0 1 340px}
.section-jumps{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:6px 0;
  border-bottom:1px solid #edf0f2;
  padding:0 0 17px;
  margin:4px 0 36px;
}
.section-jumps .jump-caption{
  font:650 10px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#9aa5af;
  letter-spacing:.1em;
  margin-right:15px;
}
.section-jumps .jump-link{
  padding:3px 0;
  border:0;
  border-radius:0;
  background:transparent;
  color:#637787;
  text-decoration:none;
  font:500 12px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  letter-spacing:0;
  transition:color .15s;
}
.section-jumps .jump-link:not(:last-child){margin-right:13px;padding-right:13px;border-right:1px solid #dfe5e8}
.section-jumps .jump-link:hover{color:#a18148;background:transparent;text-decoration:underline;text-underline-offset:3px}
.section-jumps .jump-link:focus-visible{outline:2px solid #a18148;outline-offset:3px;border-radius:2px}
#results .section-heading{
  border:0;
  padding:0;
  margin:36px 0 3px;
  gap:0;
  align-items:center;
  scroll-margin-top:25px;
}
#results .section-heading:first-child{margin-top:0}
#results .section-heading::after{
  content:"";
  order:1;
  height:1px;
  flex:1 1 auto;
  background:#e5e9ed;
  margin-left:16px;
}
#results .section-label{
  border:0;
  border-radius:0;
  background:transparent;
  padding:0;
  margin:0;
  color:#687b8a;
  font:400 17px/1.4 Georgia,"Times New Roman",serif;
  letter-spacing:0;
}
#results .section-count{
  order:2;
  margin-left:14px;
  color:#9ba6af;
  font-size:10px;
}
@media(max-width:550px){
  .header-controls{padding:10px 17px}
  .header-controls .tools{gap:8px;flex-wrap:nowrap}
  .header-controls .tabs{width:auto;flex:1 1 auto;gap:5px}
  .header-controls .tabs button{flex:1 1 auto;min-width:0;padding:10px 5px;font-size:11px;letter-spacing:0}
  .header-controls .search-control .search-toggle{height:38px;width:38px;padding:7px}
  .header-controls .search-control.open{flex:1 1 auto;min-width:0}
  .section-jumps{margin:3px 0 29px;padding-bottom:15px;row-gap:8px}
  .section-jumps .jump-caption{font-size:9px;margin-right:11px}
  .section-jumps .jump-link{font-size:11px}
  .section-jumps .jump-link:not(:last-child){margin-right:9px;padding-right:9px}
  #results .section-heading{margin-top:30px}
  #results .section-label{font-size:15px}
}
@media(max-width:550px){
  .header-controls .tools:has(.search-control.open){flex-wrap:wrap}
  .header-controls .tools:has(.search-control.open) .tabs{flex:1 1 100%}
  .header-controls .search-control.open{flex:1 1 100%;width:100%}
}
@media(prefers-reduced-motion:reduce){.header-controls .tabs button,.section-jumps .jump-link{transition:none}}
</style></head><body><header><div class="inner"><h1 class="media-wordmark" aria-label="The Media Center"><span class="wordmark-the" aria-hidden="true">The</span><span class="wordmark-title" aria-hidden="true"><span>Media</span><span class="wordmark-center">Center</span></span></h1><span class="masthead-rule" aria-hidden="true"></span><small class="panoply-label">Part of The Panoply</small></div><div class="header-controls"><div class="tools"><div class="tabs"><button id="scifi" aria-pressed="true">Sci-Fi</button><button id="other" aria-pressed="false">Beyond Sci-Fi</button><button id="animation" aria-pressed="false">Animation</button></div><div class="search-control" id="search-control"><button type="button" id="search-toggle" class="search-toggle" aria-label="Open title search" aria-controls="search" aria-expanded="false" title="Search titles"><svg class="search-glass" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.7" cy="10.7" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><svg class="search-cross" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button><input id="search" type="search" placeholder="Search titles…" aria-label="Search titles" autocomplete="off" hidden></div></div></div></header><main><nav class="section-jumps" id="section-jumps" aria-label="Jump to section"></nav><section id="results" aria-live="polite"></section></main><footer class="panoply-footer"><div class="panoply-footer-brand"><span>The Panoply</span></div></footer><script>
let lists={scifi:[],other:[],animation:[]};
let active='scifi';
const get=id=>document.getElementById(id);
function node(tag,cls,value){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(value!==undefined)e.textContent=value;
  return e;
}
async function loadPoster(item,container){
  if(!item.poster){container.textContent=item.title;return}
  const image=document.createElement('img');
  image.src=item.poster;
  image.alt=item.title+' poster';
  image.loading='lazy';
  image.onerror=()=>{container.textContent=item.title};
  container.replaceChildren(image);
}
function ratingRow(item){
  const ratings=node('div','ratings');
  const sources=[
    ['IMDb','imdb_rating','/10','imdb-solid.svg'],
    ['Rotten Tomatoes','rotten_tomatoes_score','%','rottentomatoes.svg'],
    ['Metacritic','metacritic_score','/100','metacritic.svg'],
    ['TMDb','tmdb_rating','/10','themoviedatabase.svg']
  ];
  for(const [name,key,suffix,filename] of sources){
    const cell=node('span','rating-item');
    const logo=node('img','rating-icon');
    logo.src='./assets/ratings/'+filename;
    logo.alt=name;
    logo.title=name;
    const score=node('span','rating-score rating-score-'+key,item[key]!=null?item[key]+suffix:'');
    if(item[key]==null)score.setAttribute('aria-label',name+' rating unavailable');
    cell.append(logo,score);
    ratings.append(cell);
  }
  return ratings;
}
function streamingServices(item){
  // Direct streaming platforms only; paid channel add-ons are excluded.
  const aliases={
    'Amazon Prime Video':'Prime Video',
    'Amazon Prime Video with Ads':'Prime Video',
    'Netflix Standard with Ads':'Netflix',
    'Peacock Premium':'Peacock',
    'Peacock Premium Plus':'Peacock',
    'Paramount Plus Essential':'Paramount+',
    'MGM Plus':'MGM+'
  };
  const services=new Set();
  for(const raw of item.watch_us?.stream||[]){
    if(typeof raw!=='string')continue;
    const cleaned=raw.trim();
    if(!cleaned||/ Amazon Channel$| Apple TV channel$| Roku Premium Channel$/i.test(cleaned))continue;
    services.add(aliases[cleaned]||cleaned);
  }
  const order=['Prime Video','Netflix','Hulu','Apple TV','HBO Max','Disney Plus','Peacock','Paramount+','MGM+','AMC+','Shudder'];
  return [...services].sort((a,b)=>{
    const ai=order.indexOf(a),bi=order.indexOf(b);
    return (ai<0?100:ai)-(bi<0?100:bi)||a.localeCompare(b);
  });
}
function runtimeText(item){
  const minutes=Number(item.runtime_minutes);
  if(!Number.isFinite(minutes)||minutes<=0)return 'N/A';
  const n=Math.round(minutes);
  return item.type==='TV'
    ?n+' min/episode'
    :n>=60?Math.floor(n/60)+'h'+(n%60?' '+(n%60)+'m':''):n+'m';
}
function createFacts(item){
  const strip=node('div','card-facts');
  const duration=node('div','fact');
  duration.append(node('span','fact-label','RUNTIME'));
  duration.append(node('span','fact-value',runtimeText(item)));
  const stream=node('div','fact');
  stream.append(node('span','fact-label','STREAMING'));
  const providers=node('div','stream-services');
  const services=streamingServices(item);
  if(!services.length){
    const fallback=node('span','stream-empty','N/A');
    fallback.title='No streaming service listed in the current catalog';
    providers.append(fallback);
  }else{
    for(const service of services){
      const chip=node('span','stream-chip',service);
      chip.title=service;
      providers.append(chip);
    }
  }
  stream.append(providers);
  strip.append(duration,stream,node('span','card-kind',item.type==='TV'?'TV':'Movie'));
  return strip;
}
function makeCard(item){
  const card=node('article');
  const poster=node('div','poster');
  const info=node('div','info');
  const heading=node('div','title');
  const hasImdbId=/^tt\d+$/.test(item.imdb_id||'');
  const detailsUrl=hasImdbId
    ?'https://www.imdb.com/title/'+item.imdb_id+'/'
    :'https://www.imdb.com/find/?q='+encodeURIComponent(item.title+' '+item.year)+'&s=tt';
  const titleLink=node('a','title-link',item.title);
  titleLink.href=detailsUrl;
  titleLink.target='_blank';
  titleLink.rel='noopener noreferrer';
  titleLink.setAttribute('aria-label','Look up '+item.title+' on IMDb (opens in a new tab)');
  heading.append(node('span','rank','#'+item.id),titleLink,node('span','year','('+item.year+')'));
  info.append(heading,ratingRow(item));
  const short=item.short_summary||item.synopsis;
  if(short)info.append(node('p','short-summary',short));
  if(item.cast?.length)info.append(node('p','cast','Cast: '+item.cast.join(' · ')));
  if(item.genres?.length)info.append(node('p','genres',item.genres.join(' · ')));
  card.append(poster,info,createFacts(item));
  loadPoster(item,poster);
  return card;
}
function render(){
  for(const tab of ['scifi','other','animation'])get(tab).setAttribute('aria-pressed',String(active===tab));
  const query=get('search').value.toLowerCase().trim();
  const all=lists[active];
  const shown=all.filter(x=>x.title.toLowerCase().includes(query));
  const root=get('results');
  root.replaceChildren();
  // The total is part of the first section heading, and stays accurate
  // when switching tabs, searching, or filtering.
  const groups=[...new Set(shown.map(x=>x.group))];
  if(!groups.length)groups.push('Results');
  const jumps=get('section-jumps');
  jumps.replaceChildren();
  if(shown.length){
    jumps.append(node('span','jump-caption','JUMP TO'));
    groups.forEach((group,index)=>{
      const jump=node('button','jump-link',group);
      jump.type='button';
      const destination='section-'+active+'-'+index;
      jump.setAttribute('aria-controls',destination);
      jump.onclick=()=>{
        const target=document.getElementById(destination);
        if(!target)return;
        target.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
      };
      jumps.append(jump);
    });
  }
  for(const [index,group] of groups.entries()){
    const sectionHeading=node('div','section-heading');
    sectionHeading.id='section-'+active+'-'+index;
    sectionHeading.append(node('h2','section-label',group));
    if(index===0){
      sectionHeading.append(node('span','section-count',shown.length+' of '+all.length+' titles'));
    }
    root.append(sectionHeading);
    if(shown.length===0){
      root.append(node('p','no-results','No matching titles.'));
      break;
    }
    for(const item of shown.filter(x=>x.group===group))root.append(makeCard(item));
  }
}
async function loadCatalog(){
  try{
    const response=await fetch('./catalog.json',{cache:'no-cache'});
    if(!response.ok)throw Error('Catalog unavailable');
    const data=await response.json();
    for(const key of ['scifi','other','animation'])lists[key]=(data.lists[key]||[]).map((item,index)=>({...item,id:index+1}));
    render();
  }catch(error){
    get('results').textContent='Unable to load the watchlist. Please refresh.';
  }
}
function chooseTab(tab){
  active=tab;
  get('search').value='';
  render();
  window.scrollTo({top:0,behavior:'instant'});
}
for(const tab of ['scifi','other','animation'])get(tab).onclick=()=>chooseTab(tab);
const searchInput=get('search');
const searchControl=get('search-control');
const searchToggle=get('search-toggle');
function setSearchOpen(open){
  searchControl.classList.toggle('open',open);
  searchInput.hidden=!open;
  searchToggle.setAttribute('aria-expanded',String(open));
  searchToggle.setAttribute('aria-label',open?'Close title search':'Open title search');
  searchToggle.title=open?'Close search':'Search titles';
  if(open)searchInput.focus();
  else{
    if(searchInput.value){searchInput.value='';render();}
    searchToggle.focus();
  }
}
searchToggle.onclick=()=>setSearchOpen(searchInput.hidden);
searchInput.addEventListener('keydown',event=>{
  if(event.key==='Escape'){event.preventDefault();setSearchOpen(false);}
});
searchInput.oninput=render;
loadCatalog();
</script></body></html>
