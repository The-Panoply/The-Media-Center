<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>The Media Center — Panoply</title><style>
:root{color-scheme:light;--bg:#fff;--ink:#1d2733;--sub:#667383;--line:#e7e9ed;--accent:#916b44}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#f8f8f6;border-bottom:1px solid var(--line)}
header .inner,main,footer{max-width:1320px;margin:auto;padding:30px clamp(18px,4vw,54px)}
small{color:var(--accent);letter-spacing:.19em;font-size:11px;font-weight:750}
h1{font:normal clamp(38px,5vw,58px) Georgia,serif;letter-spacing:-.035em;margin:4px 0 2px}
header p{color:var(--sub);margin:0;font-size:16px}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:2px 0 16px}
.tabs{display:flex;gap:7px}
button,input,select{font:inherit;border:1px solid #dde1e5;border-radius:7px;padding:10px 13px;background:#fff;color:var(--ink)}
button{cursor:pointer}
button[aria-pressed=true]{background:#243f59;color:#fff;border-color:#243f59;font-weight:700}
input{flex:1;min-width:170px}
select{min-width:120px}
.count{color:var(--sub);font-size:13px;margin-bottom:10px}
h2{font:normal 29px Georgia,serif;letter-spacing:-.02em;margin:36px 0 12px;padding:0 0 10px;border-bottom:1px solid var(--line);grid-column:1/-1}
#results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(24px,4vw,64px);align-items:stretch}
article{display:flex;gap:19px;padding:17px 0 22px;border-bottom:1px solid var(--line);align-items:flex-start;min-width:0}
.poster{overflow:hidden;position:relative;flex:0 0 clamp(140px,13vw,174px);width:clamp(140px,13vw,174px);aspect-ratio:2/3;background:#f2f3f4;border:0;border-radius:12px;display:grid;place-items:center;text-align:center;color:#8c95a0;font:14px Georgia,serif;padding:0}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.info{min-width:0;flex:1;padding-top:5px}
.title{font-size:20px;line-height:1.3;font-weight:700;letter-spacing:-.015em}
.rank{color:var(--accent);font-size:13px;margin-right:9px;font-weight:700}
.year,.format{color:var(--sub);font-size:13px;font-weight:400;margin-left:5px}
.note{font-size:13px;color:var(--sub);margin:9px 0 5px}.synopsis{font-size:14px;line-height:1.5;color:#435064;margin:11px 0}.meta{font-size:13px;color:var(--sub);margin-top:9px}.ratings{font-size:13px;color:#435064;margin:10px 0 8px;display:flex;gap:10px;flex-wrap:wrap}
.lookup{color:#805b36;font-size:13px;text-decoration:none}
.lookup:hover{text-decoration:underline}
footer{border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
@media(max-width:800px){#results{grid-template-columns:1fr}h2{margin-top:28px}.poster{width:160px;flex-basis:160px}}
@media(max-width:550px){header .inner,main,footer{padding:22px 17px}.tools .tabs{width:100%}.tabs button{flex:1}.poster{width:124px;flex-basis:124px}article{gap:15px;padding:17px 0}.title{font-size:19px}h2{font-size:26px}.note{margin:8px 0 4px}}
@media(max-width:360px){.poster{width:108px;flex-basis:108px}article{gap:12px}.title{font-size:17px}}
</style></head><body><header><div class="inner"><small>THE PANOPLY</small><h1>The Media Center</h1><p>Movies, television &amp; what to watch next.</p></div></header><main><div class="tools"><div class="tabs"><button id="main" aria-pressed="true">Main Watchlist</button><button id="candidates" aria-pressed="false">Candidates</button></div><input id="search" type="search" placeholder="Search titles…" aria-label="Search titles"><select id="format" aria-label="Filter by format"><option value="All">All formats</option><option value="Movie">Movies</option><option value="TV">Television</option></select></div><div class="count" id="count"></div><section id="results" aria-live="polite"></section></main><footer>Public watchlists only. Private records remain in Google Drive. Poster artwork is added automatically when a verified source is available. IMDb, Metacritic, and Rotten Tomatoes scores appear only when verified and available.</footer><script>
let lists={main:[],candidates:[]};const posterCache=new Map();async function findPoster(x){if(x.poster)return x.poster;return null}async function loadPoster(x,container){const url=await findPoster(x);if(!container.isConnected)return;if(!url){container.textContent=x.title;return}const img=document.createElement('img');img.src=url;img.alt=x.title+' poster';img.loading='lazy';img.onerror=()=>{container.textContent=x.title};container.replaceChildren(img)}async function loadCatalog(){try{const response=await fetch('./catalog.json',{cache:'no-cache'});if(!response.ok)throw Error('Catalog unavailable');const data=await response.json();for(const key of ['main','candidates'])lists[key]=(data.lists[key]||[]).map((x,i)=>({...x,id:i+1}));render()}catch(e){document.getElementById('results').textContent='Unable to load the watchlist. Please refresh.'}}let active='main';const get=id=>document.getElementById(id);function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}function render(){get('main').setAttribute('aria-pressed',active==='main');get('candidates').setAttribute('aria-pressed',active==='candidates');const q=get('search').value.toLowerCase().trim(),f=get('format').value,all=lists[active],shown=all.filter(x=>x.title.toLowerCase().includes(q)&&(f==='All'||x.type===f));get('count').textContent=shown.length+' of '+all.length+' titles';const root=get('results');root.replaceChildren();if(!shown.length){root.append(node('p','','No matching titles.'));return}for(const group of [...new Set(shown.map(x=>x.group))]){root.append(node('h2','',group));for(const x of shown.filter(x=>x.group===group)){const a=node('article'),poster=node('div','poster',''),info=node('div','info'),heading=node('div','title'),rank=node('span','rank','#'+x.id),title=node('span','',x.title),year=node('span','year','('+x.year+')'),format=node('span','format',x.type);heading.append(rank,title,year);const bits=[...(x.genres||[]),x.runtime_minutes?(x.type==='TV'?x.runtime_minutes+' min/episode':x.runtime_minutes+' min'):null].filter(Boolean);const meta=node('div','meta',bits.join(' · '));const synopsis=x.synopsis?node('p','synopsis',x.synopsis):null;const ratings=node('div','ratings');for(const [label,key,suffix] of [['IMDb','imdb_rating','/10'],['Metacritic','metacritic_score','/100'],['Rotten Tomatoes','rotten_tomatoes_score','%'],['TMDb','tmdb_rating','/10']]){ratings.append(node('span','',label+': '+(x[key]!=null?x[key]+suffix:'—')))}info.append(heading,format);if(bits.length)info.append(meta);if(synopsis)info.append(synopsis);if(ratings.childNodes.length)info.append(ratings);a.append(poster,info);root.append(a);loadPoster(x,poster)}}}get('main').onclick=()=>{active='main';render()};get('candidates').onclick=()=>{active='candidates';render()};get('search').oninput=render;get('format').onchange=render;loadCatalog();</script></body></html>
