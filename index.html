<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>The Media Center — Panoply</title><style>:root{color-scheme:light;--bg:#ffffff;--ink:#1b2635;--sub:#617084;--line:#dfe5ec;--gold:#8b6334}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{border-bottom:1px solid var(--line);background:#f6f8fa}header .inner,main,footer{max-width:920px;margin:auto;padding:24px 22px}small{color:var(--gold);letter-spacing:.2em;font-size:11px;font-weight:700}h1{font:normal clamp(34px,6vw,50px) Georgia,serif;margin:5px 0}header p{color:var(--sub);margin:0}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 14px}.tabs{display:flex;gap:6px}button,input,select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:9px 12px;background:#fff;color:var(--ink)}button{cursor:pointer}button[aria-pressed=true]{background:#244d7b;color:#fff;font-weight:700}input{flex:1;min-width:160px}select{min-width:115px}.count{color:var(--sub);font-size:12px}h2{font:normal 23px Georgia,serif;margin:28px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--line)}article{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}.poster{overflow:hidden;position:relative;flex:0 0 77px;width:77px;height:112px;background:#e9edf2;border:1px solid #d9e0e8;border-radius:3px;display:grid;place-items:center;text-align:center;color:#7b8898;font:12px Georgia,serif;padding:7px}.poster img{width:100%;height:100%;object-fit:cover;display:block}.info{min-width:0;flex:1}.title{font-size:17px;font-weight:700}.rank{color:var(--gold);font-size:13px;margin-right:8px}.year,.format{color:var(--sub);font-size:12px;font-weight:400;margin-left:7px}.note{font-size:12px;color:var(--sub);margin:6px 0}.lookup{color:var(--gold);font-size:12px;text-decoration:none}.lookup:hover{text-decoration:underline}footer{border-top:1px solid var(--line);font-size:12px;color:var(--sub)}@media(max-width:550px){.tools .tabs{width:100%}.tabs button{flex:1}.poster{width:66px;flex-basis:66px;height:98px}article{gap:12px}.title{font-size:16px}}</style></head><body><header><div class="inner"><small>THE PANOPLY</small><h1>The Media Center</h1><p>Movies, television &amp; what to watch next.</p></div></header><main><div class="tools"><div class="tabs"><button id="main" aria-pressed="true">Main Watchlist</button><button id="candidates" aria-pressed="false">Candidates</button></div><input id="search" type="search" placeholder="Search titles…" aria-label="Search titles"><select id="format" aria-label="Filter by format"><option value="All">All formats</option><option value="Movie">Movies</option><option value="TV">Television</option></select></div><div class="count" id="count"></div><section id="results" aria-live="polite"></section></main><footer>Public watchlists only. Private records remain in Google Drive. Posters are retrieved from Apple and TVmaze where available; ratings and streaming information are not yet verified.</footer><script>
const raw={main:"Project Hail Mary|2026;Raised by Wolves|2020;Predestination|2014;Annihilation|2018;Sunshine|2007;Coherence|2013;The Thirteenth Floor|1999;Equilibrium|2002;Mickey 17|2025;Solaris|2002;Source Code|2011;Midnight Special|2016;The Endless|2017;Prospect|2018;The Vast of Night|2019;Bugonia|2025;Pandorum|2009;The Artifice Girl|2022;Ad Astra|2019;Solaris|1972;Timecrimes|2007;Primer|2004;Aniara|2018;Under the Skin|2013;High Life|2018;Upstream Color|2013;Fast Color|2018;Sputnik|2020;Splice|2009;Tau|2018;Lockout|2012",candidates:"What Happened to Monday|2017;Captive State|2019;Mars Express|2023;The Girl with All the Gifts|2016;Automata|2014;The Machine|2013;Freaks|2018;The Wandering Earth|2019;The Congress|2013;The Town|2010;End of Watch|2012;Thief|1981;12 Monkeys|1995;Strange Days|1995;The Lives of Others|2006;Counterpart|2017;Pantheon|2022;Severance|2022;Years and Years|2019;Devs|2020;Dark|2017;Humans|2015"};const lists={};for(const [key,value] of Object.entries(raw)){lists[key]=value.split(';').map((v,i)=>{const [title,year]=v.split('|');return {title,year,id:i+1,type:key==='main'?(i===1?'TV':'Movie'):(i>=15?'TV':'Movie'),group:key==='main'?(i<10?'Highest Priority':i<21?'Strong Possibilities':'More Experimental or Uncertain'):(i<9?'Science Fiction & Dystopian Movies':i<12?'Character-Driven Thrillers':i<15?'Other Movie Candidates':'Television Series')}})}const posterCache=new Map();const normalize=t=>t.toLowerCase().replace(/[^a-z0-9]/g,'');function appleSearch(term){return new Promise(resolve=>{const callback='mediaPoster'+Math.random().toString(36).slice(2);const script=document.createElement('script');const timeout=setTimeout(()=>finish([]),7000);function finish(items){clearTimeout(timeout);delete window[callback];script.remove();resolve(items)}window[callback]=data=>finish(data.results||[]);script.onerror=()=>finish([]);script.src='https://itunes.apple.com/search?country=us&media=movie&entity=movie&limit=30&term='+encodeURIComponent(term)+'&callback='+callback;document.head.append(script)})}async function findPoster(x){const key=x.title+'|'+x.year+'|'+x.type;if(posterCache.has(key))return posterCache.get(key);let url=null;try{if(x.type==='TV'){const r=await fetch('https://api.tvmaze.com/search/shows?q='+encodeURIComponent(x.title));if(r.ok){const hits=await r.json();const match=hits.map(z=>z.show).find(z=>normalize(z.name)===normalize(x.title)&&(!z.premiered||Math.abs(Number(z.premiered.slice(0,4))-Number(x.year))<=1));url=match?.image?.medium||match?.image?.original||null}}else{const hits=await appleSearch(x.title);const match=hits.find(z=>normalize(z.trackName||'')===normalize(x.title)&&Math.abs(Number((z.releaseDate||'').slice(0,4))-Number(x.year))<=1);url=match?.artworkUrl100?.replace(/100x100bb/,'300x450bb')||null}}catch(e){}posterCache.set(key,url);return url}async function loadPoster(x,container){const url=await findPoster(x);if(!container.isConnected)return;if(!url){container.textContent=x.title;return}const img=document.createElement('img');img.src=url;img.alt=x.title+' official promotional artwork';img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>{container.textContent=x.title};container.replaceChildren(img)};let active='main';const get=id=>document.getElementById(id);function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}function render(){get('main').setAttribute('aria-pressed',active==='main');get('candidates').setAttribute('aria-pressed',active==='candidates');const q=get('search').value.toLowerCase().trim(),f=get('format').value,all=lists[active],shown=all.filter(x=>x.title.toLowerCase().includes(q)&&(f==='All'||x.type===f));get('count').textContent=shown.length+' of '+all.length+' titles';const root=get('results');root.replaceChildren();if(!shown.length){root.append(node('p','','No matching titles.'));return}for(const group of [...new Set(shown.map(x=>x.group))]){root.append(node('h2','',group));for(const x of shown.filter(x=>x.group===group)){const a=node('article'),poster=node('div','poster',''),info=node('div','info'),heading=node('div','title'),rank=node('span','rank','#'+x.id),title=node('span','',x.title),year=node('span','year','('+x.year+')'),format=node('span','format',x.type),note=node('p','note','Ratings and availability not yet verified'),link=node('a','lookup','Wikipedia ↗');link.href='https://en.wikipedia.org/wiki/Special:Search?search='+encodeURIComponent(x.title+' '+x.year);link.target='_blank';link.rel='noopener noreferrer';heading.append(rank,title,year);info.append(heading,format,note,link);a.append(poster,info);root.append(a);loadPoster(x,poster)}}}get('main').onclick=()=>{active='main';render()};get('candidates').onclick=()=>{active='candidates';render()};get('search').oninput=render;get('format').onchange=render;render();</script></body></html>
