<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>The Media Center — Panoply</title><style>
:root{color-scheme:light;--bg:#fff;--ink:#1d2733;--sub:#667383;--line:#e7e9ed;--accent:#916b44}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#f8f8f6;border-bottom:1px solid var(--line)}
header .inner,main,footer{max-width:1320px;margin:auto;padding:30px clamp(18px,4vw,54px)}
small{color:var(--accent);letter-spacing:.19em;font-size:11px;font-weight:750}
h1{font:normal clamp(38px,5vw,58px) Georgia,serif;letter-spacing:-.035em;margin:4px 0 2px}
header p{color:var(--sub);margin:0;font-size:16px}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:2px 0 16px}
.tabs{display:flex;gap:7px}
button,input,select{font:inherit;border:1px solid #dde1e5;border-radius:7px;padding:10px 13px;background:#fff;color:var(--ink)}
button{cursor:pointer}
button[aria-pressed=true]{background:#243f59;color:#fff;border-color:#243f59;font-weight:700}
input{flex:1;min-width:170px}
select{min-width:120px}
.count{color:var(--sub);font-size:13px;margin-bottom:10px}
h2{font:normal 29px Georgia,serif;letter-spacing:-.02em;margin:36px 0 12px;padding:0 0 10px;border-bottom:1px solid var(--line);grid-column:1/-1}
#results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(24px,4vw,64px);align-items:stretch}
article{display:flex;gap:19px;padding:17px 0 22px;border-bottom:1px solid var(--line);align-items:flex-start;min-width:0}
.poster{overflow:hidden;position:relative;flex:0 0 clamp(140px,13vw,174px);width:clamp(140px,13vw,174px);aspect-ratio:2/3;background:#f2f3f4;border:0;border-radius:12px;display:grid;place-items:center;text-align:center;color:#8c95a0;font:14px Georgia,serif;padding:0}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.info{min-width:0;flex:1;padding-top:5px}
.title{font-size:20px;line-height:1.3;font-weight:700;letter-spacing:-.015em}
.rank{color:var(--accent);font-size:13px;margin-right:9px;font-weight:700}
.year,.format{color:var(--sub);font-size:13px;font-weight:400;margin-left:5px}
.note{font-size:13px;color:var(--sub);margin:9px 0 5px}.synopsis{font-size:14px;line-height:1.5;color:#435064;margin:11px 0}.meta{font-size:13px;color:var(--sub);margin-top:9px}.ratings{font-size:13px;color:#435064;margin:10px 0 8px;display:flex;gap:10px;flex-wrap:wrap}
.lookup{color:#805b36;font-size:13px;text-decoration:none}
.lookup:hover{text-decoration:underline}
footer{border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
@media(max-width:800px){#results{grid-template-columns:1fr}h2{margin-top:28px}.poster{width:160px;flex-basis:160px}}
@media(max-width:550px){header .inner,main,footer{padding:22px 17px}.tools .tabs{width:100%}.tabs button{flex:1}.poster{width:124px;flex-basis:124px}article{gap:15px;padding:17px 0}.title{font-size:19px}h2{font-size:26px}.note{margin:8px 0 4px}}
@media(max-width:360px){.poster{width:108px;flex-basis:108px}article{gap:12px}.title{font-size:17px}}

/* Film cards: subtle, fully clickable disclosures with compact service marks */
article{cursor:pointer;transition:background-color .14s ease}
article:hover{background:#fafaf9}
article:focus-visible{outline:2px solid #916b44;outline-offset:4px;border-radius:5px}
.ratings{font-size:12px;color:#435064;margin:9px 0 7px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.rating-item{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.rating-icon{width:15px;height:15px;object-fit:contain;display:inline-block;flex:none}
.rating-item:first-child .rating-icon{width:17px;height:17px}
.watch{font-size:13px;color:#435064;margin:6px 0}
.cast{font-size:13px;color:var(--sub);margin:7px 0 0}
.short-summary{font-size:14px;line-height:1.5;color:#435064;margin:9px 0 5px}
.extra{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:#526275}
.extra[hidden]{display:none}
.extra p{margin:5px 0 8px;line-height:1.55}
.extra .meta{margin:8px 0}
.format{display:inline-block}
@media(max-width:550px){.ratings{gap:5px 9px}.rating-item{font-size:11px}.rating-icon{width:13px;height:13px}.rating-item:first-child .rating-icon{width:15px;height:15px}}

/* Compact editorial rating row */
.ratings{display:flex;align-items:center;flex-wrap:wrap;gap:3px 10px;width:100%;font-size:12px;line-height:1.25;margin:8px 0 7px;color:#435064}
.rating-item{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.rating-icon{width:14px;height:14px;object-fit:contain;display:block;flex:none}
.rating-item:first-child .rating-icon{width:27px;height:14px}
.rating-score{font-variant-numeric:tabular-nums;white-space:nowrap;color:#354150}
@media(max-width:550px){.ratings{gap:3px 8px;font-size:11px}.rating-icon{width:13px;height:13px}.rating-item:first-child .rating-icon{width:25px;height:13px}}

/* Quiet metadata: miniature rating marks, title-line format, provider icons */
.ratings{gap:3px 8px;font-size:11px;margin:7px 0 6px;line-height:1.25}
.rating-item{gap:2px}
.rating-icon{width:10px;height:10px}
.rating-item:first-child .rating-icon{width:20px;height:10px}
.format{font-size:10px;font-weight:500;letter-spacing:.01em;color:#788392;margin-left:8px;vertical-align:baseline;white-space:nowrap}
.watch{display:flex;flex-direction:column;align-items:flex-start;gap:5px;margin:7px 0 9px}
.watch-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.watch-kind{font-size:11px;color:#73808e;min-width:40px}
.watch-providers{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.watch-logo{width:20px;height:20px;border-radius:5px;object-fit:cover;display:block}
.watch-fallback{font-size:11px;color:#526275}
@media(max-width:550px){.ratings{gap:3px 6px;font-size:10.5px}.rating-icon{width:10px;height:10px}.rating-item:first-child .rating-icon{width:19px;height:10px}.format{font-size:10px}.watch-logo{width:19px;height:19px}}
/* Streaming only: simple text, no provider logos or purchase options */
.watch{display:block;margin:7px 0 9px;font-size:13px;line-height:1.45;color:#435064}

/* The Media Center — editorial navy & antique-gold refinement */
:root{
  --bg:#FFFFFF;
  --ink:#203448;
  --sub:#687684;
  --line:#ECEEF0;
  --accent:#A27B40;
  --navy:#203448;
  --gold:#B18A4C;
  --paper:#FFFFFF;
}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--paper);border-top:0;border-bottom:1px solid #EDF0F2}
header .inner{padding-top:18px;padding-bottom:17px}
header small{color:var(--accent);font-size:10px;letter-spacing:.27em;font-weight:750}
h1{color:#1C3247;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(41px,5.3vw,64px);line-height:1.14;letter-spacing:-.047em;margin:3px 0 3px}
header p{color:#647282;font-size:14px;letter-spacing:.012em}
header .inner::after{content:"";display:block;width:43px;height:2px;background:var(--gold);margin-top:10px}
main{padding-top:29px}
.tools{gap:15px;align-items:center;margin:0 0 18px;padding-bottom:15px;border-bottom:1px solid var(--line)}
.tabs{gap:22px;align-self:stretch;align-items:stretch}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:#74808A;padding:10px 1px 12px;font-size:13px;font-weight:600;letter-spacing:.015em;white-space:nowrap;transition:color .15s,border-color .15s}
.tabs button:hover{color:var(--navy);background:transparent}
.tabs button[aria-pressed=true]{background:transparent;border-color:var(--gold);color:var(--navy);font-weight:700}
input,select{border:1px solid #E1DED7;border-radius:6px;background:#fff;color:var(--navy);font-size:13px;padding:10px 12px;box-shadow:0 1px 2px rgba(20,38,53,.025)}
input::placeholder{color:#9AA2A8}
input:focus,select:focus,button:focus-visible{outline:2px solid rgba(177,138,76,.45);outline-offset:3px}
select{min-width:125px}
.count{color:#89919A;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
h2{color:#23394D;font:normal 29px/1.2 Georgia,"Times New Roman",serif;letter-spacing:-.025em;margin:38px 0 11px;padding:0 0 13px;border-bottom:1px solid #E8EBEE}
article{border-bottom-color:#EDF0F2}
article:hover{background:#FBFCFD}
article:focus-visible{outline-color:var(--gold)}
.title{color:#1F3244;letter-spacing:-.019em}
.rank{color:var(--accent)}
.year,.format{color:#8A929B}
.short-summary{color:#4D5C69}
.cast,.extra,.meta{color:#7A858E}
.extra{border-top-color:#ECEFF1}
.rating-score{color:#485867}
footer{background:#FFFFFF;border-top:1px solid #EDF0F2;color:#87909A;font-size:11px;line-height:1.7}
@media(max-width:800px){
  header .inner{padding-top:17px;padding-bottom:16px}
  .tools{gap:11px}
  h2{margin-top:31px}
}
@media(max-width:550px){
  header .inner{padding-top:15px;padding-bottom:14px}
  header .inner::after{margin-top:9px;width:39px}
  h1{font-size:clamp(38px,10vw,49px)}
  header p{font-size:13px}
  main{padding-top:18px}
  .tools{gap:9px;padding-bottom:12px}
  .tabs{width:100%;gap:22px}
  .tabs button{flex:0 0 auto;padding:7px 1px 10px;font-size:13px}
  input{min-width:0}
  select{min-width:112px}
  h2{font-size:26px}
}
@media(prefers-reduced-motion:reduce){.tabs button{transition:none}}

/* Softly defined film entries: warm panels with near-invisible outlines */
#results{row-gap:14px;column-gap:clamp(18px,3vw,42px)}
#results h2{margin-bottom:0}
#results article{
  background:#FFFFFF;
  border:1px solid #E4E8EB;
  border-radius:12px;
  padding:15px;
  min-width:0;
  transition:background-color .16s ease,border-color .16s ease;
}
#results article:hover{background:#FAFBFC;border-color:#DCE2E6}
#results article:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(max-width:550px){
  #results{row-gap:11px}
  #results article{padding:12px;border-radius:11px}
}
@media(prefers-reduced-motion:reduce){#results article{transition:none}}

/* Custom cinematic wordmark: genuine Georgia serif C with a small inset antique-gold reel. */
h1.media-wordmark{
  display:flex;
  align-items:baseline;
  gap:.16em;
  margin:3px 0 3px;
  font:400 clamp(38px,5.3vw,64px)/1.12 Georgia,"Times New Roman",serif;
  letter-spacing:-.045em;
  color:#1C3247;
  white-space:nowrap;
}
.wordmark-the{
  flex:none;
  align-self:flex-start;
  margin-top:.10em;
  font-size:.38em;
  font-style:italic;
  line-height:1.1;
  letter-spacing:-.015em;
}
.wordmark-title{display:inline-flex;align-items:baseline;gap:.2em}
.wordmark-center{display:inline;white-space:nowrap}
.wordmark-c{display:inline-block;position:relative;font:inherit;vertical-align:baseline}
.wordmark-reel{
  position:absolute;
  width:.28em;
  height:.28em;
  left:54%;
  top:.55em;
  transform:translate(-50%,-50%);
  pointer-events:none;
}
@media(max-width:550px){
  h1.media-wordmark{font-size:clamp(29px,8.65vw,44px);gap:.14em}
  .wordmark-title{gap:.15em}
}

/* A restrained, winding film strip beneath the title, not a second header ornament. */
header .inner::after{display:none}
.wordmark-title{position:relative;padding-bottom:16px}
.wordmark-filmstrip{
  position:absolute;
  pointer-events:none;
  left:1%;
  bottom:-1px;
  width:98%;
  height:23px;
  display:block;
  overflow:visible;
}
.wordmark-reel{width:.34em;height:.34em}
@media(max-width:550px){
  .wordmark-title{padding-bottom:12px}
  .wordmark-filmstrip{height:15px;bottom:0}
}

</svg></span></h1><p>Movies, television &amp; what to watch next.</p></div></header><main><div class="tools"><div class="tabs"><button id="main" aria-pressed="true">Main Watchlist</button><button id="candidates" aria-pressed="false">Candidates</button></div><input id="search" type="search" placeholder="Search titles…" aria-label="Search titles"><select id="format" aria-label="Filter by format"><option value="All">All formats</option><option value="Movie">Movies</option><option value="TV">Television</option></select></div><div class="count" id="count"></div><section id="results" aria-live="polite"></section></main><footer>Public watchlists only. Private records remain in Google Drive. Poster artwork is added automatically when a verified source is available. IMDb, Metacritic, and Rotten Tomatoes scores appear only when verified and available.</footer><script>
let lists={main:[],candidates:[]};
let active='main';
const get=id=>document.getElementById(id);
function node(tag,cls,value){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(value!==undefined)e.textContent=value;
  return e;
}
async function loadPoster(item,container){
  if(!item.poster){container.textContent=item.title;return}
  const image=document.createElement('img');
  image.src=item.poster;
  image.alt=item.title+' poster';
  image.loading='lazy';
  image.onerror=()=>{container.textContent=item.title};
  container.replaceChildren(image);
}
function ratingRow(item){
  const ratings=node('div','ratings');
  const sources=[
    ['IMDb','imdb_rating','/10','imdb-solid.svg'],
    ['Rotten Tomatoes','rotten_tomatoes_score','%','rottentomatoes.svg'],
    ['Metacritic','metacritic_score','/100','metacritic.svg'],
    ['TMDb','tmdb_rating','/10','themoviedatabase.svg']
  ];
  for(const [name,key,suffix,filename] of sources){
    const cell=node('span','rating-item');
    const logo=node('img','rating-icon');
    logo.src='./assets/ratings/'+filename;
    logo.alt=name;
    logo.title=name;
    cell.append(logo,node('span','rating-score',item[key]!=null?item[key]+suffix:'—'));
    ratings.append(cell);
  }
  return ratings;
}
function availability(item){
  const w=item.watch_us;
  if(!w?.stream?.length)return null;
  const services=[...new Set(w.stream)];
  return node('div','watch','Stream: '+services.join(' · '));
}
function makeCard(item){
  const card=node('article');
  card.setAttribute('role','button');
  card.tabIndex=0;
  card.setAttribute('aria-expanded','false');
  card.setAttribute('aria-label','Show details for '+item.title);
  const poster=node('div','poster');
  const info=node('div','info');
  const heading=node('div','title');
  heading.append(node('span','rank','#'+item.id),node('span','',item.title),node('span','year','('+item.year+')'),node('span','format',item.type));
  info.append(heading,ratingRow(item));
  const watch=availability(item);
  const short=item.short_summary||item.synopsis;
  if(short)info.append(node('p','short-summary',short));
  if(item.cast?.length)info.append(node('p','cast','Cast: '+item.cast.join(' · ')));
  const extra=node('div','extra');
  extra.hidden=true;
  if(watch)extra.append(watch);
  if(item.synopsis&&item.synopsis!==short)extra.append(node('p','',item.synopsis));
  const metadata=[...(item.genres||[]),item.runtime_minutes?(item.type==='TV'?item.runtime_minutes+' min/episode':item.runtime_minutes+' min'):null].filter(Boolean);
  if(metadata.length)extra.append(node('div','meta',metadata.join(' · ')));
  if(item.watch_us?.checked)extra.append(node('p','','US availability via TMDb · checked '+item.watch_us.checked));
  if(!extra.childNodes.length)extra.append(node('p','','No additional details available yet.'));
  info.append(extra);
  const toggle=()=>{
    extra.hidden=!extra.hidden;
    const expanded=!extra.hidden;
    card.setAttribute('aria-expanded',String(expanded));
    card.setAttribute('aria-label',(expanded?'Hide':'Show')+' details for '+item.title);
  };
  card.addEventListener('click',toggle);
  card.addEventListener('keydown',event=>{
    if(event.key==='Enter'||event.key===' '){event.preventDefault();toggle()}
  });
  card.append(poster,info);
  loadPoster(item,poster);
  return card;
}
function render(){
  get('main').setAttribute('aria-pressed',String(active==='main'));
  get('candidates').setAttribute('aria-pressed',String(active==='candidates'));
  const query=get('search').value.toLowerCase().trim();
  const format=get('format').value;
  const all=lists[active];
  const shown=all.filter(x=>x.title.toLowerCase().includes(query)&&(format==='All'||x.type===format));
  get('count').textContent=shown.length+' of '+all.length+' titles';
  const root=get('results');
  root.replaceChildren();
  if(!shown.length){root.append(node('p','','No matching titles.'));return}
  for(const group of [...new Set(shown.map(x=>x.group))]){
    root.append(node('h2','',group));
    for(const item of shown.filter(x=>x.group===group))root.append(makeCard(item));
  }
}
async function loadCatalog(){
  try{
    const response=await fetch('./catalog.json',{cache:'no-cache'});
    if(!response.ok)throw Error('Catalog unavailable');
    const data=await response.json();
    for(const key of ['main','candidates'])lists[key]=(data.lists[key]||[]).map((item,index)=>({...item,id:index+1}));
    render();
  }catch(error){
    get('results').textContent='Unable to load the watchlist. Please refresh.';
  }
}
get('main').onclick=()=>{active='main';render()};
get('candidates').onclick=()=>{active='candidates';render()};
get('search').oninput=render;
get('format').onchange=render;
loadCatalog();
</script></body></html>
